[project]
name = "decagon"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "black>=26.3.1",
    "isort>=8.0.1",
    "langchain>=1.2.15",
    "langchain-google-genai>=4.2.2",
    "langgraph>=1.1.9",
    "python-dotenv>=1.2.2",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "streamlit>=1.42",
]

[tool.uv]
# Copy files from the cache into .venv instead of hardlinking. Hardlink mode
# has been corrupting this venv (silently emptying packages) when the shared
# cache is touched by other projects.
link-mode = "copy"
